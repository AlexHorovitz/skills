name: quality

# SSD quality gate (refactor R1, post-v1.19 milestone).
#   - gate-rules: runs methodology/gate-rules.sh against origin/main on every PR to main.
#   - parity-test: runs scripts/parity-test.sh on every PR and every push to main.
# Either job failing surfaces a red check on the PR. Per ADR-0012 Pillar 5 (warnings, not walls)
# this REPORTS — a red check does not block the merge, and the developer may ship past it loudly
# and on the record.
#
# WHAT THIS FILE USED TO CLAIM, and why it was wrong (Feynman audit post-v2.11.0, D12): it asserted
# that branch protection was not required here, "by design". The repo carries an ACTIVE ruleset ("Overwatch",
# all branches) requiring `pull_request` and `required_signatures`, and every push this session
# reported "Bypassed rule violations". So protection exists.
#
# The distinction Pillar 5 actually draws, and it survives: the pillar rejects **required status
# checks that gate a merge**, not source hygiene. The ruleset requires a PR and a signature; it
# does NOT list `required_status_checks`, so neither job below can block anything, and admins
# bypass it. A PR requirement is a paper trail, not a wall. Verified:
#   gh api repos/:owner/:repo/rulesets/<id> --jq '[.rules[].type]'
#     -> ["deletion","non_fast_forward","pull_request","required_signatures"]
#
# See ADR-0005 (gate execution model) and ADR-0006 (frontmatter validator) for why these are
# executable artifacts rather than orchestrator-internal LLM checks.

on:
  # NO `branches:` filter on pull_request, deliberately (Feynman audit post-v2.11.0, follow-on).
  # It used to read `branches: [main]`, so a STACKED pull request — one whose base is another feature
  # branch — triggered nothing at all: no gate, no parity, no shellcheck. PR #48 merged that way, into
  # its parent branch, entirely unchecked. Its content was only covered afterwards, when the parent's
  # own PR re-ran. A safety net that is absent exactly when you split work into a stack is worse than
  # no net, because the merge button still looks green.
  pull_request:
  push:
    branches: [main]

jobs:
  gate-rules:
    name: SSD gate rules
    # gate-rules.sh diffs against a base ref; only meaningful on a PR.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Run gate rules against the PR's base
        # `github.base_ref` — NOT a hardcoded `main`. On a stacked PR the base is the parent feature
        # branch, and diffing against main would report the whole stack rather than this PR's own
        # delta, inheriting the parent's findings and making the check unreadable.
        #
        # Passed through `env:` rather than interpolated into `run:`. A branch name can contain shell
        # metacharacters, and `${{ }}` inside a run block is expanded by the runner BEFORE bash sees
        # it — the standard GitHub Actions script-injection vector.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF":refs/remotes/origin/"$BASE_REF"
          bash methodology/gate-rules.sh --base origin/"$BASE_REF"

  shellcheck:
    name: shellcheck
    # C10 of the 2026-09-01 Feynman audit: 5,124 lines of shell had NEVER been linted, and
    # `lint_results:` recorded "shellcheck exit 127 — pre-existing environment gap" in five artifacts
    # across three features. The gap was `brew install shellcheck`. Running it in CI is what stops the
    # finding from silently reopening the next time a local environment lacks the tool.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: shellcheck -S warning methodology/*.sh scripts/*.sh

  parity-test:
    name: gate-rules parity test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Run parity test
        run: bash scripts/parity-test.sh
