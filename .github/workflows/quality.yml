name: quality

# SSD quality gate (refactor R1, post-v1.19 milestone).
#   - gate-rules: runs methodology/gate-rules.sh against origin/main on every PR to main.
#   - parity-test: runs scripts/parity-test.sh on every PR and every push to main.
# Either job failing surfaces a red check on the PR. Per ADR-0012 Pillar 5 (warnings, not walls)
# this REPORTS — it does not hard-block the merge (no branch protection is required, by design;
# the developer may ship past it, loudly and on the record). See ADR-0005 (gate execution model)
# and ADR-0006 (frontmatter validator) for why these are executable artifacts rather than
# orchestrator-internal LLM checks.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gate-rules:
    name: SSD gate rules
    # gate-rules.sh diffs against a base ref; only meaningful on a PR.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Run gate rules against origin/main
        run: |
          git fetch origin main:refs/remotes/origin/main
          bash methodology/gate-rules.sh --base origin/main

  shellcheck:
    name: shellcheck
    # C10 of the 2026-09-01 Feynman audit: 5,124 lines of shell had NEVER been linted, and
    # `lint_results:` recorded "shellcheck exit 127 — pre-existing environment gap" in five artifacts
    # across three features. The gap was `brew install shellcheck`. Running it in CI is what stops the
    # finding from silently reopening the next time a local environment lacks the tool.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: shellcheck -S warning methodology/*.sh scripts/*.sh

  parity-test:
    name: gate-rules parity test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Run parity test
        run: bash scripts/parity-test.sh
