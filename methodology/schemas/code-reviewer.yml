# Frontmatter schema — code-reviewer output.
# v1: structural validation only. v3 adds optional provenance fields.
# A model-supplied gate_pass is not a gate result.

skill: code-reviewer
applies_to:
  - 04-code-review.md
  - 04-code-review-round-*.md
  - code-review/round-*.md
  - review-*.md

required:
  skill: string
  version: string
  produced_at: timestamp
  produced_by: string
  project: string
  scope: string
  consumed_by: list
  finding_counts: dict
  gate_pass: bool
  remediation_mode: bool
  round: int
  closed_from_previous_round: list

optional:
  reviewed_snapshot: string
  execution_method: string
  result_status: string
  provenance: dict

notes: "Nested finding_counts members stay documented in code-reviewer/SKILL.md. They are not encoded here, and they are not dropped."
