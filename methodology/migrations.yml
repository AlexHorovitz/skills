# methodology/migrations.yml — declarative SSD convention-migration manifest (ADR-0013).
#
# One entry per SSD release that changed a PROJECT-VISIBLE convention. `/ssd upgrade` reads this
# (via methodology/migrate.sh) to tell a project what conventions it has drifted past, and — from
# iter B — to migrate it forward.
#
# Append-only, ordered by introduced_in. Each entry:
#   id            stable kebab-case key (primary key; never renamed/reused)
#   introduced_in library version that added the convention (the selection key)
#   obsoleted_in  (optional) library version that RETIRED the convention. A project upgrading to a
#                 target >= obsoleted_in no longer sees the entry — the convention does not exist in
#                 the destination world, so it is never (re-)applied. A staged upgrade to a target
#                 BELOW obsoleted_in still sees it (that target still had the convention). This is how
#                 an append-only manifest expresses removal without deleting the (stable) id. Added
#                 v2.2.0 (ssd-2.0-cuts iter C, ADR-0012/0013) when SSD 2.0 removed the profile keys.
#   applies_to    project | library   (`/ssd upgrade` runs only `project`-scoped entries)
#   kind          mechanical | guided (guided = a practice; cannot be auto-applied)
#   elective      (optional) true = this entry is NOT drift. It is a CHOICE only some projects should
#                 ever make, so it is excluded from the default sweep entirely: never listed in the
#                 report, never PENDING, never applied by `--apply`, and never a participant in
#                 recorded-version advancement. It runs only when named (`--elect <id>`). Absent =>
#                 false => swept exactly as before, so every pre-2.9.0 entry is unaffected.
#                 ORTHOGONAL to `kind`: `kind` answers HOW an entry is adopted, `elective` answers
#                 WHETHER every project should adopt it at all. Added v2.9.0 (ADR-0013 addendum,
#                 ADR-0017) because a *mechanical* private-mode entry would have let
#                 `/ssd upgrade --apply` untrack a team's committed ADRs on a routine upgrade.
#   adr           the decision record that introduced it
#   title         one-line human description
#   detect        HUMAN description of the idempotency probe. The executable probe lives in
#                 migrate.sh as detect_<id-with-underscores>(); guided entries have detect: null.
#   apply         (mechanical) HUMAN description of the migration action (executed in iter B+)
#   guidance      (guided) what the maintainer should adopt by hand
#
# NOTE: `apply` text is the HUMAN description of the mechanical migration; the executable action
#       lives in migrate.sh as apply_<id-with-underscores>() (`--apply`). As of v1.23.0 all four
#       mechanical entries — including `current-yml-v2` (v1→v2 split, conservative-safe form) — have
#       an executable apply. `guidance` text (guided entries) is informational — guided practices are
#       adopted by hand, never auto-applied.

schema_version: 1

migrations:
  - id: current-yml-v2
    introduced_in: "1.4.0"
    applies_to: project
    kind: mechanical
    adr: ADR-0002
    title: "current.yml v2 schema + current.notes.yml sidecar"
    detect: "current.yml contains 'schema_version: 2'"
    apply: "split legacy v1 current.yml into v2 machine state + current.notes.yml sidecar (.bak first)"

  - id: dev-profile-keys
    introduced_in: "1.10.0"
    # retired in SSD 2.0 (ADR-0012); see guided entry profile-concept-removed. Comment on its own line:
    # an inline `# …` after the value would leak into the parsed obsoleted_in (iter-B MAJOR-4 class).
    obsoleted_in: "2.0.0"
    applies_to: project
    kind: mechanical
    adr: ADR-0004
    title: "developer_profile + teaching_mode keys in project.yml"
    detect: "project.yml ssd block has 'developer_profile'"
    apply: "add developer_profile: standard + teaching_mode block (defaults) if absent (non-destructive merge)"

  - id: parallel-features-keys
    introduced_in: "1.15.0"
    applies_to: project
    kind: mechanical
    adr: ADR-0007
    title: "project.yml.ssd.{branch_pattern,worktree_root,worktree_name_pattern,switch_note_default}"
    detect: "project.yml ssd block has 'branch_pattern'"
    apply: "add the four ssd.* keys with documented defaults if absent (non-destructive merge)"

  - id: selective-gitignore
    introduced_in: "1.18.0"
    applies_to: project
    kind: mechanical
    adr: ADR-0008
    title: "selective .ssd/ commit split (gitignore_mode + selective .gitignore pattern)"
    detect: "project.yml ssd block has 'gitignore_mode'"
    apply: "set gitignore_mode: selective; rewrite .gitignore to the selective pattern (.gitignore.bak first)"

  - id: decision-record-doctrine
    introduced_in: "1.20.1"
    applies_to: project
    kind: guided
    adr: ADR-0011
    title: "decisions = ADR + revisit-aware tracking issue"
    detect: null
    guidance: "Adopt the ADR + revisit-aware tracking-issue pattern (with a falsifiable 'Revisit when:') for consequential decisions."

  - id: profile-concept-removed
    introduced_in: "2.0.0"
    applies_to: project
    kind: guided
    adr: ADR-0012
    title: "developer_profile / teaching_mode removed from project.yml (now ignored)"
    detect: null
    guidance: "SSD 2.0 removed the profile concept. Delete the 'developer_profile' key and the 'teaching_mode:' block from .ssd/project.yml — 2.0 ignores them (no crash), but they are dead config. Progressive disclosure (no-arg /ssd Auto-Detect) replaces tiered guidance; the escape-hatch chapters replace expert depth-on-demand."

  - id: single-surface-doctrine
    introduced_in: "2.0.0"
    applies_to: project
    kind: guided
    adr: ADR-0012
    title: "one surface, progressively disclosed — commands are a thin alias, not a co-equal surface"
    detect: null
    guidance: "SSD 2.0 collapsed the dual-surface 'perfect parity' doctrine. The conversational/no-arg /ssd path is primary; /ssd <verb> is a thin alias that lowers into it, not a separate stateful surface. The full verb set is retained as a discoverable escape hatch in ssd/chapters/. No project.yml change is required — this entry exists so a v1-era project learns the doctrine shift on /ssd upgrade (R3 re-surfacing)."

  - id: github-issue-tracking-keys
    introduced_in: "2.3.0"
    applies_to: project
    kind: guided
    adr: ADR-0014
    title: "integrations.github.issue_tracking / auto_close toggles in project.yml"
    detect: null
    guidance: "SSD can mirror workstream state to GitHub issues (ADR=epic, workstream=feature issue, ssd:phase/* labels), one-way and opt-in. To enable, add `issue_tracking: on` (and optionally `auto_close: true`) under the `- type: github` entry in .ssd/project.yml integrations. Absent ≡ off — zero network, no behavior change — so this is guided, not mechanical: there is nothing to migrate unless you want the feature. See ADR-0014 and the README 'GitHub issue tracking' section."

  - id: gate-inputs-present
    introduced_in: "2.5.0"
    applies_to: project
    kind: mechanical
    adr: ADR-0015
    title: "test_command written to committed .ssd/gate.yml so the tests-pass gate rule can run"
    detect: "project.yml or gate.yml defines a test_command key (executable probe: detect() in migrate.sh greps `^[[:space:]]*test_command:` in either file)"
    apply: "detect the test command most-specific-first (Makefile test: > package.json scripts.test > pytest > go test ./... > cargo test > swift test); write `test_command: <cmd>` into .ssd/gate.yml, or a commented placeholder if nothing is detected. Idempotent: skips when a test_command is already present."

  - id: committed-gate-yml
    introduced_in: "2.5.0"
    applies_to: project
    kind: mechanical
    adr: ADR-0015
    title: "committed .ssd/gate.yml + the !.ssd/gate.yml selective-gitignore exception"
    detect: ".ssd/gate.yml exists AND the project's .gitignore carries the `!.ssd/gate.yml` exception (executable probe: detect() in migrate.sh)"
    apply: "create .ssd/gate.yml (carrying any test_command / feature_flag_marker already set in project.yml, else a commented template) and append the `!.ssd/gate.yml` exception to .gitignore if the selective block lacks it. Idempotent on both the file and the exception line."

  - id: strict-selective-gitignore
    introduced_in: "2.6.0"
    applies_to: project
    kind: mechanical
    adr: ADR-0008
    title: "selective .gitignore allow-list made load-bearing (deep deny) + review-*.md / feynman.md negations"
    detect: "the project's .gitignore carries the `.ssd/features/**` deep-deny line (executable probe: detect() in migrate.sh)"
    apply: "insert `.ssd/features/**` + `.ssd/milestones/**` denies and the `!.ssd/features/**/` + `!.ssd/milestones/**/` directory re-includes after the `!.ssd/milestones/` line, then add the `!.ssd/milestones/**/review-*.md` and `!.ssd/milestones/**/feynman.md` negations. Without the deep deny, `.ssd/*` matches depth-1 only and every file under features/ and milestones/ is committable regardless of the allow-list. Idempotent on both passes; only upgrades a project that already carries the selective block."

  - id: feynman-gate-rule
    introduced_in: "2.7.0"
    applies_to: project
    kind: guided
    adr: ADR-0016
    title: "feynman-clean gate rule + /feynman proposed at milestone, verify, audit, pre-ship"
    detect: null
    guidance: "The gate gained a `feynman-clean` rule: any .ssd/**/feynman.md in a change set must report zero `contradicted` and zero `theater` claims, or the gate FAILs (logged `/ssd ship --force` override, as with any FAILable rule). Nothing to install — the rule ships in gate-rules.sh and SKIPs in every project with no audit in scope, so a project that never runs /feynman is unaffected. What changed for you: /ssd milestone now offers the audit at Step 0.5 (declining is recorded, not silent), and /ssd verify re-proposes it. Run /feynman before your next release to see what it says."

  - id: private-mode
    introduced_in: "2.9.0"
    applies_to: project
    kind: mechanical
    # `elective` on its OWN line, never inline after another value — the awk/yaml_get readers do not
    # strip a trailing `# …` from every field, and a comment leaking into a parsed value is the
    # ssd-upgrade iter-B MAJOR-4 defect class.
    elective: true
    adr: ADR-0017
    title: "private mode retrofit (gitignore_mode: private + untrack tracked SSD artifacts)"
    detect: "project.yml.ssd.gitignore_mode is `private` AND .gitignore carries the `# ssd:gitignore-mode=private` sentinel (executable probe: detect_private_mode() in migrate.sh)"
    apply: "DRY-RUN BY DEFAULT. `--elect private-mode` enumerates every tracked path under .ssd/ and docs/{decisions,runbooks,architecture}, prints the complete list (flagging any docs/ file SSD did not create), prints the history-is-not-rewritten warning, and exits 10 having mutated nothing. With `--confirm`: writes methodology/private.gitignore verbatim, sets gitignore_mode/branch_pattern/issue_tracking, promotes gate inputs into project.yml, then `git rm --cached` the enumerated paths. Idempotent: an already-private project is a no-op."
